<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="星空ツアー翻訳">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>星空ツアー翻訳 / 별 투어 번역</title>
<style>
:root {
  --bg: #000;
  --surface: #1a0606;
  --border: #4a1010;
  --text: #ff5a3c;
  --text-dim: #a83020;
  --text-faint: #6a1818;
  --accent: #ff8866;
  --accent-bg: #5a1818;
  --button-bg: #1a0606;
  --selected-bg: #5a1818;
  --selected-border: #ff8866;
}
body.normal-theme {
  --bg: #ffffff;
  --surface: #f8fafc;
  --border: #cbd5e1;
  --text: #0f172a;
  --text-dim: #475569;
  --text-faint: #94a3b8;
  --accent: #2563eb;
  --accent-bg: #2563eb;
  --button-bg: #f1f5f9;
  --selected-bg: #dbeafe;
  --selected-border: #2563eb;
}
body.normal-theme .phrase-btn.selected .ko-ruby,
body.normal-theme .phrase-btn.selected .ja {
  color: #0f172a;
}
body.normal-theme .phrase-btn.selected .ko-ruby ruby rt {
  color: #475569;
  opacity: 1;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Apple SD Gothic Neo", sans-serif;
  min-height: 100vh;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
}

header {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: env(safe-area-inset-top, 0) 12px 0 12px;
}

.row1 {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 0 6px 0;
}
h1 {
  font-size: 14px; margin: 0;
  color: var(--text-dim); font-weight: 500;
  flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.icon-btn {
  background: var(--button-bg); color: var(--text-dim);
  border: 1px solid var(--border);
  padding: 7px 11px; border-radius: 14px;
  font-size: 13px; cursor: pointer;
  font-family: inherit;
  flex-shrink: 0;
}
.icon-btn.active {
  background: var(--accent-bg);
  color: #fff;
  border-color: var(--accent);
}

.speed-row {
  display: flex; gap: 6px; align-items: center;
  padding-bottom: 8px;
  font-size: 12px; color: var(--text-faint);
}
.speed-row .label { margin-right: 4px; }
.speed-btn {
  background: var(--button-bg); color: var(--text-dim);
  border: 1px solid var(--border);
  padding: 5px 10px; border-radius: 12px;
  font-size: 12px; cursor: pointer;
  font-family: inherit;
}
.speed-btn.active {
  background: var(--accent-bg);
  color: #fff;
  border-color: var(--accent);
  font-weight: 600;
}

nav {
  display: flex; gap: 8px; overflow-x: auto;
  padding: 4px 0 10px 0;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
nav::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  background: var(--button-bg); color: var(--text-dim);
  border: 1px solid var(--border);
  padding: 8px 14px; border-radius: 18px;
  font-size: 13px; cursor: pointer; white-space: nowrap;
  font-family: inherit;
  transition: background 0.1s, color 0.1s;
}
.tab.active {
  background: var(--accent-bg);
  color: #fff;
  border-color: var(--accent);
  font-weight: 600;
}

main {
  padding: 12px 12px calc(env(safe-area-inset-bottom, 0) + 100px) 12px;
  display: flex; flex-direction: column; gap: 10px;
}

.phrase-btn {
  background: var(--button-bg);
  color: var(--text);
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  text-align: left;
  cursor: pointer;
  width: 100%;
  font-family: inherit;
  display: flex; flex-direction: column; gap: 8px;
  transition: background 0.08s, border-color 0.08s;
}
.phrase-btn:active { background: var(--selected-bg); }
.phrase-btn.selected {
  background: var(--selected-bg);
  border-color: var(--selected-border);
}
.phrase-btn .ja {
  font-size: 16px; line-height: 1.4;
  color: var(--text);
}
.phrase-btn .ko-ruby {
  font-size: 17px; line-height: 2.4;
  color: var(--text-dim);
  word-break: keep-all;
}
.phrase-btn .ko-ruby ruby rt {
  font-size: 10px;
  color: var(--text-dim);
  font-weight: 400;
  opacity: 0.75;
}
.phrase-btn.selected .ko-ruby,
.phrase-btn.selected .ja {
  color: #fff;
}
.phrase-btn.selected .ko-ruby ruby rt {
  color: #fff;
  opacity: 0.9;
}
.phrase-btn.has-pose {
  display: grid;
  grid-template-columns: 44px 1fr;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
}
.phrase-btn .pose-num {
  grid-row: span 2;
  font-size: 30px; font-weight: 700;
  color: var(--accent);
  text-align: center;
  line-height: 1;
}
.phrase-btn.has-pose .ja,
.phrase-btn.has-pose .ko-ruby { grid-column: 2; }

.select-marker {
  display: none;
  position: absolute;
  top: 8px; right: 8px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 13px; font-weight: 700;
  align-items: center; justify-content: center;
  line-height: 1;
}
.phrase-btn { position: relative; }
body.select-mode .phrase-btn.selected .select-marker {
  display: flex;
}

/* Modal */
#modal {
  position: fixed; inset: 0;
  background: var(--bg);
  display: none;
  flex-direction: column;
  z-index: 100;
  padding: env(safe-area-inset-top, 0) 16px env(safe-area-inset-bottom, 0) 16px;
}
#modal.active { display: flex; }
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.modal-close, .modal-speak {
  background: var(--button-bg); color: var(--text);
  border: 1px solid var(--border);
  padding: 9px 16px; border-radius: 10px;
  font-size: 15px; cursor: pointer;
  font-family: inherit;
}
.modal-speak {
  background: var(--accent-bg); color: #fff;
  border-color: var(--accent);
  font-weight: 600;
}
.modal-body {
  flex: 1;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  padding: 20px 4px;
  gap: 24px;
  cursor: pointer;
  overflow-y: auto;
}
.modal-pose-num {
  font-size: 110px; font-weight: 800;
  color: var(--accent);
  line-height: 1;
}
.ja-text {
  font-size: 16px; color: var(--text-dim);
  text-align: center; line-height: 1.5;
}
.ko-text {
  font-size: 30px; color: var(--text);
  font-weight: 600;
  text-align: center; line-height: 2.6;
  word-break: keep-all;
}
.ko-text ruby rt {
  font-size: 14px;
  color: var(--text-dim);
  font-weight: 500;
}
.modal-hint {
  font-size: 11px; color: var(--text-faint);
}

@media (min-height: 700px) {
  .ko-text { font-size: 36px; line-height: 2.8; }
  .ko-text ruby rt { font-size: 16px; }
  .modal-pose-num { font-size: 140px; }
}

/* Selection action bar */
#action-bar {
  position: fixed;
  left: 12px; right: 12px;
  bottom: calc(env(safe-area-inset-bottom, 0) + 12px);
  background: var(--accent-bg);
  border: 1px solid var(--accent);
  border-radius: 16px;
  padding: 10px 12px;
  display: none;
  align-items: center; gap: 8px;
  z-index: 50;
  box-shadow: 0 4px 24px rgba(0,0,0,0.5);
}
#action-bar.visible { display: flex; }
.action-count {
  flex: 1;
  font-size: 14px; color: #fff; font-weight: 600;
}
.action-btn {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.3);
  padding: 9px 14px; border-radius: 10px;
  font-size: 14px; cursor: pointer;
  font-family: inherit;
  font-weight: 600;
}
.action-btn.primary {
  background: #fff;
  color: var(--accent-bg);
  border-color: #fff;
}
.action-btn.primary:disabled {
  opacity: 0.6;
}

/* Now-playing indicator on phrase btn */
.phrase-btn.playing {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(255,255,255,0.1);
}
</style>
</head>
<body>

<header>
  <div class="row1">
    <h1>★ 星空ツアー翻訳</h1>
    <button class="icon-btn" id="selectToggle" aria-label="選択モード">☑ 選択</button>
    <button class="icon-btn" id="themeToggle" aria-label="テーマ">☀</button>
  </div>
  <div class="speed-row">
    <span class="label">再生速度:</span>
    <button class="speed-btn" data-speed="0.7">0.7x</button>
    <button class="speed-btn active" data-speed="1.0">1.0x</button>
    <button class="speed-btn" data-speed="1.2">1.2x</button>
    <button class="speed-btn" data-speed="1.5">1.5x</button>
  </div>
  <nav id="tabs"></nav>
</header>

<main id="phrases"></main>

<div id="action-bar">
  <div class="action-count" id="actionCount">0個選択中</div>
  <button class="action-btn" id="clearSelected">クリア</button>
  <button class="action-btn primary" id="playSelected">▶ 再生</button>
</div>

<div id="modal">
  <div class="modal-header">
    <button class="modal-close" id="modalClose">閉じる</button>
    <button class="modal-speak" id="modalSpeak">🔊 もう一度</button>
  </div>
  <div class="modal-body" id="modalBody">
    <div class="modal-pose-num" id="modalPoseNum" style="display:none"></div>
    <div class="ja-text" id="modalJa"></div>
    <div class="ko-text" id="modalKo"></div>
    <div class="modal-hint">画面をタップで閉じます</div>
  </div>
</div>

<script>
// Each phrase: { ja, ru (ruby string with "korean|katakana" tokens), h (audio hash), pose? }
const PHRASES = [
  {
    c: "① 開始",
    items: [
      { ja: "こんにちは。本日はよろしくお願いします。", ru: "안녕하세요.|アンニョンハセヨ 오늘|オヌル 잘|チャル 부탁드립니다.|プタッドゥリムニダ", h: "0e8e5fd68c" },
      { ja: "私は岡村です。本日のガイドを担当します。", ru: "저는|チョヌン 오카무라입니다.|オカムライムニダ 오늘|オヌル 가이드를|カイドゥルル 맡고|マッコ 있습니다.|イッスムニダ", h: "10a4737208" },
      { ja: "申し訳ありません。私は韓国語が話せないので、このアプリで対応します。", ru: "죄송합니다.|チェソンハムニダ 저는|チョヌン 한국어를|ハングゴルル 못해서|モテソ 이|イ 앱으로|エブロ 안내해|アンネヘ 드리겠습니다.|ドゥリゲッスムニダ", h: "33e7228a3b" },
      { ja: "ご質問にはお答えできない場合があります。ご了承ください。", ru: "질문에는|チルムネヌン 답변드리기|タッピョンドゥリギ 어려울|オリョウル 수|ス 있습니다.|イッスムニダ 양해|ヤンヘ 부탁드립니다.|プタッドゥリムニダ", h: "5dba4695ac" },
      { ja: "本日は星空と一緒にお客様を撮影する『星空撮影』ツアーです。", ru: "오늘은|オヌルン 별이|ピョリ 빛나는|ピンナヌン 하늘과|ハヌルグァ 함께|ハムッケ 손님을|ソンニムル 촬영하는|チャリョンハヌン '별|ピョル 사진|サジン 촬영'|チャリョン 투어입니다.|トゥオイムニダ", h: "364b1a85f3" },
      { ja: "帰りは今来た道を通ってお帰りください。", ru: "돌아가실|トラガシル 때는|ッテヌン 지금|チグム 오신|オシン 길로|キルロ 돌아가|トラガ 주세요.|ジュセヨ", h: "ae1e3c9757" }
    ]
  },
  {
    c: "② 移動・注意",
    items: [
      { ja: "これから海まで案内します。ついて来てください。", ru: "지금부터|チグムプト 바다까지|パダッカジ 안내해|アンネヘ 드리겠습니다.|ドゥリゲッスムニダ 따라와|ッタラワ 주세요.|ジュセヨ", h: "d3fce77bf9" },
      { ja: "道中が少し険しいので、足元にご注意ください。", ru: "가는|カヌン 길이|キリ 조금|チョグム 험하니|ホムハニ 발밑을|パルミットゥル 조심해|チョシメ 주세요.|ジュセヨ", h: "1c4c9635a3" },
      { ja: "周りの木々にもご注意ください。", ru: "주변|チュビョン 나무에도|ナムエド 주의해|チュイヘ 주세요.|ジュセヨ", h: "afb16ce8df" },
      { ja: "自然の生き物がいるので、踏まないように気をつけてください。", ru: "자연|チャヨン 생물이|センムリ 있으니|イッスニ 밟지|パルッチ 않도록|アントロッ 조심해|チョシメ 주세요.|ジュセヨ", h: "e45f94a01d" },
      { ja: "運が良ければヤシガニも見られます。", ru: "운이|ウニ 좋으면|チョウミョン 야자집게도|ヤジャジッケド 볼|ボル 수|ス 있습니다.|イッスムニダ", h: "6a03715296" },
      { ja: "ゆっくりで大丈夫ですよ。", ru: "천천히|チョンチョニ 오셔도|オショド 괜찮습니다.|クェンチャンスムニダ", h: "8666948203" }
    ]
  },
  {
    c: "③ 撮影場所",
    items: [
      { ja: "砂浜の岩の上に立ってください。", ru: "모래사장의|モレサジャンエ 바위|パウィ 위에|ウィエ 서|ソ 주세요.|ジュセヨ", h: "e8c1c843b2" },
      { ja: "砂浜の岩に座ってください。", ru: "모래사장의|モレサジャンエ 바위에|パウィエ 앉아|アンジャ 주세요.|ジュセヨ", h: "0c249962d3" },
      { ja: "もう少し中央に寄ってください。", ru: "조금|チョグム 더|ト 중앙으로|チュンアンウロ 모여|モヨ 주세요.|ジュセヨ", h: "b33e1b01bf" },
      { ja: "1組につき5カットまで撮影します。", ru: "한|ハン 팀당|ティムダン 5컷까지|オーコッカジ 촬영합니다.|チャリョンハムニダ", h: "39a131be59" }
    ]
  },
  {
    c: "④ ポーズ選択",
    items: [
      { ja: "このパネルから1〜7番のポーズを選んでください。", ru: "이|イ 패널에서|ペノレソ 1번부터|イルボンプト 7번까지|チルボンッカジ 포즈를|ポジュルル 골라|コルラ 주세요.|ジュセヨ", h: "7c6098bdc6" },
      { ja: "次のポーズに移ります。", ru: "다음|タウム 포즈로|ポジュロ 넘어가겠습니다.|ノモガゲッスムニダ", h: "a0fb75cee9" },
      { ja: "1番のポーズでお願いします。(後ろ姿)", ru: "1번|イルボン 포즈로|ポジュロ 부탁드립니다.|プタッドゥリムニダ 뒷모습이에요.|ティンモスビエヨ", h: "45a1c3aa74", pose: "1" },
      { ja: "2番のポーズでお願いします。(向き合い)", ru: "2번|イーボン 포즈로|ポジュロ 부탁드립니다.|プタッドゥリムニダ 마주보기예요.|マジュボギイェヨ", h: "d4e6f64d42", pose: "2" },
      { ja: "3番のポーズでお願いします。(正面・指さし)", ru: "3번|サムボン 포즈로|ポジュロ 부탁드립니다.|プタッドゥリムニダ 정면에서|チョンミョネソ 손가락으로|ソンカラグロ 가리켜|カリキョ 주세요.|ジュセヨ", h: "b06fa923ea", pose: "3" },
      { ja: "4番のポーズでお願いします。(後ろ姿・指さし)", ru: "4번|サーボン 포즈로|ポジュロ 부탁드립니다.|プタッドゥリムニダ 뒷모습에서|ティンモスベソ 손가락으로|ソンカラグロ 가리켜|カリキョ 주세요.|ジュセヨ", h: "2cacfc9279", pose: "4" },
      { ja: "5番のポーズでお願いします。(空を見上げる)", ru: "5번|オーボン 포즈로|ポジュロ 부탁드립니다.|プタッドゥリムニダ 정면에서|チョンミョネソ 하늘을|ハヌルル 바라봐|パラボァ 주세요.|ジュセヨ", h: "a0f0e9ea07", pose: "5" },
      { ja: "6番のポーズでお願いします。(団体・各自違う方向)", ru: "6번|ユッボン 포즈로|ポジュロ 부탁드립니다.|プタッドゥリムニダ 단체로|タンチェロ 각자|カクチャ 다른|タルン 방향을|パンヒャンウル 봐|ボァ 주세요.|ジュセヨ", h: "06b908a0eb", pose: "6" },
      { ja: "7番のポーズでお願いします。(団体・同じ方向)", ru: "7번|チルボン 포즈로|ポジュロ 부탁드립니다.|プタッドゥリムニダ 단체로|タンチェロ 같은|カトゥン 방향을|パンヒャンウル 봐|ボァ 주세요.|ジュセヨ", h: "c5f61001d6", pose: "7" }
    ]
  },
  {
    c: "⑤ 撮影中",
    items: [
      { ja: "「スタート」と言ったら動かないでください。", ru: "'스타트'라고|スタートゥラゴ 하면|ハミョン 움직이지|ウムジギジ 말아|マラ 주세요.|ジュセヨ", h: "3871a55a61" },
      { ja: "「OK」と言うまでそのままお願いします。", ru: "'OK'라고|オーケーラゴ 할|ハル 때까지|ッテッカジ 그대로|クデロ 있어|イッソ 주세요.|ジュセヨ", h: "cadeb055a5" },
      { ja: "動くと写真がブレてしまいます。", ru: "움직이면|ウムジギミョン 사진이|サジニ 흔들립니다.|フンドゥルリムニダ", h: "6302b099d8" },
      { ja: "息を止めなくて大丈夫です。", ru: "숨을|スムル 참지|チャムジ 않으셔도|アヌショド 괜찮습니다.|クェンチャンスムニダ", h: "d8d34af156" },
      { ja: "星に向かって指をさしてください。", ru: "별을|ピョルル 향해|ヒャンヘ 손가락으로|ソンカラグロ 가리켜|カリキョ 주세요.|ジュセヨ", h: "fd49fa6349" },

// === Utilities ===
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderRuby(ru) {
  return ru.split(/\s+/).filter(Boolean).map(t => {
    const i = t.indexOf('|');
    if (i < 0) return escapeHtml(t);
    const base = t.slice(0, i);
    const reading = t.slice(i + 1);
    return `<ruby>${escapeHtml(base)}<rt>${escapeHtml(reading)}</rt></ruby>`;
  }).join(' ');
}

function extractKo(ru) {
  return ru.split(/\s+/).filter(Boolean).map(t => {
    const i = t.indexOf('|');
    return i < 0 ? t : t.slice(0, i);
  }).join(' ');
}

// === State ===
const STORAGE_THEME = 'theme';
const STORAGE_CAT = 'lastCategory';
const STORAGE_SPEED = 'speed';

let currentCategory = parseInt(localStorage.getItem(STORAGE_CAT) || '0', 10);
if (currentCategory >= PHRASES.length || currentCategory < 0) currentCategory = 0;

let currentSpeed = parseFloat(localStorage.getItem(STORAGE_SPEED) || '1.0');
let selectMode = false;
const selected = []; // array of {cat, idx, item}
let isPlayingBatch = false;
let stopBatchRequested = false;
let currentAudio = null;

// === Elements ===
const tabsEl = document.getElementById('tabs');
const phrasesEl = document.getElementById('phrases');
const modal = document.getElementById('modal');
const modalBody = document.getElementById('modalBody');
const modalJa = document.getElementById('modalJa');
const modalKo = document.getElementById('modalKo');
const modalPoseNum = document.getElementById('modalPoseNum');
const modalClose = document.getElementById('modalClose');
const modalSpeak = document.getElementById('modalSpeak');
const themeToggle = document.getElementById('themeToggle');
const selectToggle = document.getElementById('selectToggle');
const actionBar = document.getElementById('action-bar');
const actionCount = document.getElementById('actionCount');
const playSelectedBtn = document.getElementById('playSelected');
const clearSelectedBtn = document.getElementById('clearSelected');
const speedBtns = document.querySelectorAll('.speed-btn');

// === Audio ===
function stopAllAudio() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.src = '';
    currentAudio = null;
  }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

function playItem(item, opts = {}) {
  return new Promise((resolve) => {
    stopAllAudio();
    const audio = new Audio(`audio/${item.h}.mp3`);
    audio.playbackRate = currentSpeed;
    currentAudio = audio;
    let resolved = false;
    const finish = () => {
      if (resolved) return;
      resolved = true;
      if (currentAudio === audio) currentAudio = null;
      resolve();
    };
    audio.onended = finish;
    audio.onerror = () => {
      if (resolved) return;
      // Fallback to TTS
      speakKoreanFallback(extractKo(item.ru), currentSpeed).then(finish);
    };
    audio.play().catch(() => {
      if (resolved) return;
      speakKoreanFallback(extractKo(item.ru), currentSpeed).then(finish);
    });
  });
}

function speakKoreanFallback(text, rate) {
  return new Promise((resolve) => {
    if (!('speechSynthesis' in window)) return resolve();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.rate = rate || 1;
    const voices = speechSynthesis.getVoices();
    const koVoice = voices.find(v => v.lang === 'ko-KR') || voices.find(v => v.lang.startsWith('ko'));
    if (koVoice) u.voice = koVoice;
    u.onend = resolve;
    u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}

// === Render ===
function renderTabs() {
  tabsEl.innerHTML = '';
  PHRASES.forEach((cat, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === currentCategory ? ' active' : '');
    btn.textContent = cat.c;
    btn.onclick = () => {
      currentCategory = i;
      localStorage.setItem(STORAGE_CAT, String(i));
      renderAll();
      btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    };
    tabsEl.appendChild(btn);
  });
  const active = tabsEl.querySelector('.tab.active');
  if (active) active.scrollIntoView({ inline: 'center', block: 'nearest' });
}

function isSelected(item) {
  return selected.some(s => s.h === item.h);
}

function renderPhrases() {
  phrasesEl.innerHTML = '';
  PHRASES[currentCategory].items.forEach((item, idx) => {
    const btn = document.createElement('button');
    btn.className = 'phrase-btn' + (item.pose ? ' has-pose' : '') + (isSelected(item) ? ' selected' : '');
    btn.dataset.h = item.h;
    if (item.pose) {
      const num = document.createElement('div');
      num.className = 'pose-num';
      num.textContent = item.pose;
      btn.appendChild(num);
    }
    const ja = document.createElement('div');
    ja.className = 'ja';
    ja.textContent = item.ja;
    btn.appendChild(ja);
    const koRuby = document.createElement('div');
    koRuby.className = 'ko-ruby';
    koRuby.innerHTML = renderRuby(item.ru);
    btn.appendChild(koRuby);
    const marker = document.createElement('div');
    marker.className = 'select-marker';
    marker.textContent = '✓';
    btn.appendChild(marker);
    btn.onclick = () => onPhraseClick(item, btn);
    phrasesEl.appendChild(btn);
  });
  updateActionBar();
}

function renderAll() {
  renderTabs();
  renderPhrases();
  window.scrollTo(0, 0);
}

// === Click handler ===
function onPhraseClick(item, btn) {
  if (selectMode) {
    toggleSelect(item, btn);
  } else {
    openModal(item);
  }
}

function toggleSelect(item, btn) {
  const i = selected.findIndex(s => s.h === item.h);
  if (i >= 0) {
    selected.splice(i, 1);
    btn.classList.remove('selected');
  } else {
    selected.push(item);
    btn.classList.add('selected');
    // Show selection order in marker
  }
  // Update marker numbers (selection order)
  const markers = phrasesEl.querySelectorAll('.phrase-btn.selected .select-marker');
  markers.forEach(m => {
    const h = m.parentElement.dataset.h;
    const order = selected.findIndex(s => s.h === h);
    m.textContent = order >= 0 ? String(order + 1) : '✓';
  });
  updateActionBar();
}

function updateActionBar() {
  if (selectMode && selected.length > 0) {
    actionBar.classList.add('visible');
    actionCount.textContent = `${selected.length}個選択中`;
  } else {
    actionBar.classList.remove('visible');
  }
}

// === Modal ===
function openModal(item) {
  modalJa.textContent = item.ja;
  modalKo.innerHTML = renderRuby(item.ru);
  if (item.pose) {
    modalPoseNum.textContent = item.pose;
    modalPoseNum.style.display = 'block';
  } else {
    modalPoseNum.style.display = 'none';
  }
  modal.classList.add('active');
  modal.dataset.currentH = item.h;
  setTimeout(() => playItem(item), 100);
}

function closeModal() {
  modal.classList.remove('active');
  stopAllAudio();
}

modalClose.onclick = (e) => { e.stopPropagation(); closeModal(); };
modalBody.onclick = closeModal;
modalSpeak.onclick = (e) => {
  e.stopPropagation();
  const h = modal.dataset.currentH;
  for (const cat of PHRASES) {
    const item = cat.items.find(i => i.h === h);
    if (item) { playItem(item); return; }
  }
};

// === Theme ===
function applyTheme(isDay) {
  document.body.classList.toggle('normal-theme', isDay);
  themeToggle.textContent = isDay ? '☾' : '☀';
  document.querySelector('meta[name="theme-color"]').setAttribute(
    'content', isDay ? '#ffffff' : '#000000');
}
themeToggle.onclick = () => {
  const isDay = !document.body.classList.contains('normal-theme');
  applyTheme(isDay);
  localStorage.setItem(STORAGE_THEME, isDay ? 'day' : 'night');
};
applyTheme(localStorage.getItem(STORAGE_THEME) === 'day');

// === Speed ===
function applySpeed(s) {
  currentSpeed = s;
  speedBtns.forEach(b => b.classList.toggle('active', parseFloat(b.dataset.speed) === s));
  localStorage.setItem(STORAGE_SPEED, String(s));
}
speedBtns.forEach(b => {
  b.onclick = () => applySpeed(parseFloat(b.dataset.speed));
});
applySpeed(currentSpeed);

// === Select mode ===
selectToggle.onclick = () => {
  selectMode = !selectMode;
  document.body.classList.toggle('select-mode', selectMode);
  selectToggle.classList.toggle('active', selectMode);
  selectToggle.textContent = selectMode ? '✓ 選択中' : '☑ 選択';
  if (!selectMode) {
    selected.length = 0;
    document.querySelectorAll('.phrase-btn.selected').forEach(b => b.classList.remove('selected'));
  }
  updateActionBar();
};

clearSelectedBtn.onclick = () => {
  selected.length = 0;
  document.querySelectorAll('.phrase-btn.selected').forEach(b => b.classList.remove('selected'));
  updateActionBar();
};

playSelectedBtn.onclick = async () => {
  if (selected.length === 0 || isPlayingBatch) return;
  isPlayingBatch = true;
  stopBatchRequested = false;
  playSelectedBtn.textContent = '⏸ 停止';
  playSelectedBtn.onclick = () => { stopBatchRequested = true; };
  for (let i = 0; i < selected.length; i++) {
    if (stopBatchRequested) break;
    const item = selected[i];
    const btn = phrasesEl.querySelector(`.phrase-btn[data-h="${item.h}"]`);
    if (btn) {
      document.querySelectorAll('.phrase-btn.playing').forEach(b => b.classList.remove('playing'));
      btn.classList.add('playing');
      btn.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    await playItem(item);
    if (stopBatchRequested) break;
    if (i < selected.length - 1) {
      await new Promise(r => setTimeout(r, 600));
    }
  }
  document.querySelectorAll('.phrase-btn.playing').forEach(b => b.classList.remove('playing'));
  isPlayingBatch = false;
  stopBatchRequested = false;
  playSelectedBtn.textContent = '▶ 再生';
  playSelectedBtn.onclick = arguments.callee;
};

// Re-bind playSelected because we replaced its onclick during play
function bindPlaySelected() {
  playSelectedBtn.onclick = async () => {
    if (selected.length === 0 || isPlayingBatch) return;
    isPlayingBatch = true;
    stopBatchRequested = false;
    playSelectedBtn.textContent = '⏸ 停止';
    const stopHandler = () => { stopBatchRequested = true; stopAllAudio(); };
    playSelectedBtn.onclick = stopHandler;
    for (let i = 0; i < selected.length; i++) {
      if (stopBatchRequested) break;
      const item = selected[i];
      const btn = phrasesEl.querySelector(`.phrase-btn[data-h="${item.h}"]`);
      if (btn) {
        document.querySelectorAll('.phrase-btn.playing').forEach(b => b.classList.remove('playing'));
        btn.classList.add('playing');
        btn.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      await playItem(item);
      if (stopBatchRequested) break;
      if (i < selected.length - 1) {
        await new Promise(r => setTimeout(r, 500));
      }
    }
    document.querySelectorAll('.phrase-btn.playing').forEach(b => b.classList.remove('playing'));
    isPlayingBatch = false;
    stopBatchRequested = false;
    playSelectedBtn.textContent = '▶ 再生';
    bindPlaySelected();
  };
}
bindPlaySelected();

// === Init ===
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = () => {};
  speechSynthesis.getVoices();
}

renderAll();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
