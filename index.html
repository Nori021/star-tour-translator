<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="星空ツアー翻訳">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>星空ツアー翻訳 / 별 투어 번역</title>
<style>
:root {
  --bg: #0a1420;
  --surface: #142436;
  --border: #2a4060;
  --text: #e8f0ff;
  --text-dim: #8aa8d0;
  --text-faint: #4a6080;
  --accent: #5aa0ff;
  --accent-bg: #2a5090;
  --button-bg: #142436;
  --selected-bg: #2a5090;
  --selected-border: #5aa0ff;
}
body.normal-theme {
  --bg: #ffffff;
  --surface: #f8fafc;
  --border: #cbd5e1;
  --text: #0f172a;
  --text-dim: #475569;
  --text-faint: #94a3b8;
  --accent: #2563eb;
  --accent-bg: #2563eb;
  --button-bg: #f1f5f9;
  --selected-bg: #dbeafe;
  --selected-border: #2563eb;
}
body.normal-theme .phrase-btn.selected .ko-ruby,
body.normal-theme .phrase-btn.selected .ja {
  color: #0f172a;
}
body.normal-theme .phrase-btn.selected .ko-ruby ruby rt {
  color: #475569;
  opacity: 1;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Apple SD Gothic Neo", sans-serif;
  min-height: 100vh;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
}

header {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: env(safe-area-inset-top, 0) 12px 0 12px;
}

.row1 {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 0 6px 0;
}
h1 {
  font-size: 14px; margin: 0;
  color: var(--text-dim); font-weight: 500;
  flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.icon-btn {
  background: var(--button-bg); color: var(--text-dim);
  border: 1px solid var(--border);
  padding: 7px 11px; border-radius: 14px;
  font-size: 13px; cursor: pointer;
  font-family: inherit;
  flex-shrink: 0;
}
.icon-btn.active {
  background: var(--accent-bg);
  color: #fff;
  border-color: var(--accent);
}

.speed-row {
  display: flex; gap: 6px; align-items: center;
  padding-bottom: 8px;
  font-size: 12px; color: var(--text-faint);
}
.speed-row .label { margin-right: 4px; }
.speed-btn {
  background: var(--button-bg); color: var(--text-dim);
  border: 1px solid var(--border);
  padding: 5px 10px; border-radius: 12px;
  font-size: 12px; cursor: pointer;
  font-family: inherit;
}
.speed-btn.active {
  background: var(--accent-bg);
  color: #fff;
  border-color: var(--accent);
  font-weight: 600;
}

nav {
  display: flex; gap: 8px; overflow-x: auto;
  padding: 4px 0 10px 0;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
nav::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  background: var(--button-bg); color: var(--text-dim);
  border: 1px solid var(--border);
  padding: 8px 14px; border-radius: 18px;
  font-size: 13px; cursor: pointer; white-space: nowrap;
  font-family: inherit;
  transition: background 0.1s, color 0.1s;
}
.tab.active {
  background: var(--accent-bg);
  color: #fff;
  border-color: var(--accent);
  font-weight: 600;
}

main {
  padding: 12px 12px calc(env(safe-area-inset-bottom, 0) + 100px) 12px;
  display: flex; flex-direction: column; gap: 10px;
}

.phrase-btn {
  background: var(--button-bg);
  color: var(--text);
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  text-align: left;
  cursor: pointer;
  width: 100%;
  font-family: inherit;
  display: flex; flex-direction: column; gap: 8px;
  transition: background 0.08s, border-color 0.08s;
}
.phrase-btn:active { background: var(--selected-bg); }
.phrase-btn.selected {
  background: var(--selected-bg);
  border-color: var(--selected-border);
}
.phrase-btn .ja {
  font-size: 16px; line-height: 1.4;
  color: var(--text);
}
.phrase-btn .ko-ruby {
  font-size: 17px; line-height: 2.4;
  color: var(--text-dim);
  word-break: keep-all;
}
.phrase-btn .ko-ruby ruby rt {
  font-size: 10px;
  color: var(--text-dim);
  font-weight: 400;
  opacity: 0.75;
}
.phrase-btn.selected .ko-ruby,
.phrase-btn.selected .ja {
  color: #fff;
}
.phrase-btn.selected .ko-ruby ruby rt {
  color: #fff;
  opacity: 0.9;
}
.phrase-btn.has-pose {
  display: grid;
  grid-template-columns: 44px 1fr;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
}
.phrase-btn .pose-num {
  grid-row: span 2;
  font-size: 30px; font-weight: 700;
  color: var(--accent);
  text-align: center;
  line-height: 1;
}
.phrase-btn.has-pose .ja,
.phrase-btn.has-pose .ko-ruby { grid-column: 2; }

.select-marker {
  display: none;
  position: absolute;
  top: 8px; right: 8px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 13px; font-weight: 700;
  align-items: center; justify-content: center;
  line-height: 1;
}
.phrase-btn { position: relative; }
body.select-mode .phrase-btn.selected .select-marker {
  display: flex;
}

/* Word blocks view */
.words-view { display: flex; flex-direction: column; gap: 12px; padding: 4px 0; }
.words-toolbar { display: flex; gap: 8px; }
.words-toolbar .big-btn {
  flex: 1;
  background: var(--accent-bg); color: #fff;
  border: 1px solid var(--accent);
  padding: 12px; border-radius: 12px;
  font-size: 15px; font-weight: 600;
  font-family: inherit; cursor: pointer;
}
.words-toolbar .secondary-btn {
  background: var(--button-bg); color: var(--text);
  border: 1px solid var(--border);
  padding: 12px 14px; border-radius: 12px;
  font-size: 14px; font-family: inherit; cursor: pointer;
  white-space: nowrap;
}
.words-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  touch-action: pan-y;
}
.word-card {
  aspect-ratio: 1;
  background: var(--button-bg);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 6px 4px;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  text-align: center;
  cursor: pointer;
  position: relative;
  gap: 4px;
  overflow: hidden;
  word-break: keep-all;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  transition: transform 0.18s, opacity 0.15s;
}
.word-card:active { background: var(--selected-bg); }
.word-card.playing { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255,255,255,0.1); }
.word-card.selected {
  background: var(--selected-bg);
  border-color: var(--selected-border);
}
.word-card .select-marker {
  display: none;
  position: absolute;
  top: 2px; right: 2px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 11px; font-weight: 700;
  align-items: center; justify-content: center;
  line-height: 1;
}
body.select-mode .word-card.selected .select-marker { display: flex; }
body.normal-theme .word-card.selected .word-ja,
body.normal-theme .word-card.selected .word-ko { color: #0f172a; }
body.normal-theme .word-card.selected .word-ko ruby rt { color: #475569; opacity: 1; }
.word-card.drag-source { opacity: 0.25; }
.word-card.drag-clone {
  position: fixed;
  pointer-events: none;
  z-index: 1000;
  transform: scale(1.08);
  box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  opacity: 0.95;
  transition: none;
}
.word-ja { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.25; }
.word-ko { font-size: 13px; line-height: 2.1; color: var(--text-dim); }
.word-ko ruby rt { font-size: 8px; color: var(--text-faint); opacity: 0.85; }
.word-actions {
  position: absolute;
  top: 2px; left: 2px;
  z-index: 2;
}
.word-action {
  background: #c0392b; color: #fff;
  border: 1px solid #c0392b;
  width: 22px; height: 22px;
  border-radius: 50%;
  font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0;
  font-family: inherit; line-height: 1;
}
.words-empty {
  text-align: center; padding: 32px 16px;
  color: var(--text-dim); font-size: 14px;
  background: var(--button-bg);
  border: 1px dashed var(--border);
  border-radius: 12px;
}
.words-backup {
  margin-top: 16px;
  padding: 12px;
  background: var(--button-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex; flex-direction: column; gap: 10px;
}
.backup-label {
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.5;
}
.backup-row {
  display: flex; gap: 8px;
}
.backup-row .secondary-btn {
  flex: 1;
  background: var(--button-bg); color: var(--text);
  border: 1px solid var(--border);
  padding: 10px; border-radius: 10px;
  font-size: 13px; font-family: inherit;
  cursor: pointer;
}
.backup-help {
  font-size: 11px;
  color: var(--text-faint);
  line-height: 1.5;
}

/* Add word modal */
#addModal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: flex-end;
  z-index: 200;
}
#addModal.active { display: flex; }
.add-modal-inner {
  background: var(--bg);
  border-top: 1px solid var(--border);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 16px 16px calc(env(safe-area-inset-bottom, 0) + 24px) 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.add-modal-inner h3 {
  margin: 0; font-size: 17px; color: var(--text);
}
.add-modal-inner label {
  font-size: 12px; color: var(--text-dim); margin-bottom: -6px;
}
.add-modal-inner input, .add-modal-inner textarea {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border);
  padding: 12px; border-radius: 10px;
  font-size: 16px; font-family: inherit;
  -webkit-user-select: text; user-select: text;
}
.add-modal-inner .preview {
  background: var(--button-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  display: flex; flex-direction: column; gap: 4px;
}
.add-modal-inner .preview .pv-ja { font-size: 14px; color: var(--text-dim); }
.add-modal-inner .preview .pv-ko { font-size: 24px; line-height: 2.4; color: var(--text); }
.add-modal-inner .preview .pv-ko ruby rt { font-size: 12px; color: var(--text-dim); }
.add-modal-inner .row { display: flex; gap: 8px; }
.add-modal-inner .row > * { flex: 1; }
.add-modal-inner button.primary {
  background: var(--accent-bg); color: #fff;
  border: 1px solid var(--accent);
  padding: 12px; border-radius: 10px;
  font-size: 15px; font-weight: 600;
  font-family: inherit; cursor: pointer;
}
.add-modal-inner button.primary:disabled { opacity: 0.5; }
.add-modal-inner button.secondary {
  background: var(--button-bg); color: var(--text);
  border: 1px solid var(--border);
  padding: 12px; border-radius: 10px;
  font-size: 15px; font-family: inherit; cursor: pointer;
}
.add-modal-inner .status {
  font-size: 13px; color: var(--text-dim);
  padding: 6px 0;
}
.add-modal-inner .status.error { color: #ff6b6b; }
.add-modal-inner .key-section {
  background: var(--button-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.add-modal-inner .key-section .label {
  font-size: 12px; color: var(--text-dim);
}

/* Free translation view */
.translate-view {
  display: flex; flex-direction: column;
  gap: 12px;
  padding: 4px 0;
}
.translate-view textarea {
  width: 100%;
  min-height: 160px;
  font-size: 18px;
  line-height: 1.5;
  padding: 14px;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-family: inherit;
  resize: vertical;
  -webkit-user-select: text;
  user-select: text;
}
.translate-view textarea:focus {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
.translate-view .big-btn {
  background: var(--accent-bg);
  color: #fff;
  border: 1px solid var(--accent);
  padding: 14px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}
.translate-view .big-btn:active { opacity: 0.7; }
.translate-view .secondary-btn {
  background: var(--button-bg);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 11px;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}
.translate-view .help-box {
  background: var(--button-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  font-size: 13px;
  line-height: 1.7;
  color: var(--text-dim);
}
.translate-view .help-box strong { color: var(--text); }
.translate-view .help-box .step {
  display: block;
  padding: 2px 0;
}

/* Modal */
#modal {
  position: fixed; inset: 0;
  background: var(--bg);
  display: none;
  flex-direction: column;
  z-index: 100;
  padding: env(safe-area-inset-top, 0) 16px env(safe-area-inset-bottom, 0) 16px;
}
#modal.active { display: flex; }
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.modal-close, .modal-speak {
  background: var(--button-bg); color: var(--text);
  border: 1px solid var(--border);
  padding: 9px 16px; border-radius: 10px;
  font-size: 15px; cursor: pointer;
  font-family: inherit;
}
.modal-speak {
  background: var(--accent-bg); color: #fff;
  border-color: var(--accent);
  font-weight: 600;
}
.modal-body {
  flex: 1;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  padding: 20px 4px;
  gap: 24px;
  cursor: pointer;
  overflow-y: auto;
}
.modal-pose-num {
  font-size: 110px; font-weight: 800;
  color: var(--accent);
  line-height: 1;
}
.ja-text {
  font-size: 16px; color: var(--text-dim);
  text-align: center; line-height: 1.5;
}
.ko-text {
  font-size: 30px; color: var(--text);
  font-weight: 600;
  text-align: center; line-height: 2.6;
  word-break: keep-all;
}
.ko-text ruby rt {
  font-size: 14px;
  color: var(--text-dim);
  font-weight: 500;
}
.modal-hint {
  font-size: 11px; color: var(--text-faint);
}

@media (min-height: 700px) {
  .ko-text { font-size: 36px; line-height: 2.8; }
  .ko-text ruby rt { font-size: 16px; }
  .modal-pose-num { font-size: 140px; }
}

/* Selection action bar */
#action-bar {
  position: fixed;
  left: 12px; right: 12px;
  bottom: calc(env(safe-area-inset-bottom, 0) + 12px);
  background: var(--accent-bg);
  border: 1px solid var(--accent);
  border-radius: 16px;
  padding: 10px 12px;
  display: none;
  align-items: center; gap: 8px;
  z-index: 50;
  box-shadow: 0 4px 24px rgba(0,0,0,0.5);
}
#action-bar.visible { display: flex; }
.action-count {
  flex: 1;
  font-size: 14px; color: #fff; font-weight: 600;
}
.action-btn {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.3);
  padding: 9px 14px; border-radius: 10px;
  font-size: 14px; cursor: pointer;
  font-family: inherit;
  font-weight: 600;
}
.action-btn.primary {
  background: #fff;
  color: var(--accent-bg);
  border-color: #fff;
}
.action-btn.primary:disabled {
  opacity: 0.6;
}

/* Now-playing indicator on phrase btn */
.phrase-btn.playing {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(255,255,255,0.1);
}
</style>
</head>
<body>

<header>
  <div class="row1">
    <h1>★ 星空ツアー翻訳</h1>
    <button class="icon-btn" id="selectToggle" aria-label="選択モード">☑ 選択</button>
    <button class="icon-btn" id="themeToggle" aria-label="テーマ">☀</button>
  </div>
  <div class="speed-row">
    <span class="label">再生速度:</span>
    <button class="speed-btn" data-speed="0.7">0.7x</button>
    <button class="speed-btn active" data-speed="1.0">1.0x</button>
    <button class="speed-btn" data-speed="1.2">1.2x</button>
    <button class="speed-btn" data-speed="1.5">1.5x</button>
  </div>
  <nav id="tabs"></nav>
</header>

<main id="phrases"></main>

<div id="action-bar">
  <div class="action-count" id="actionCount">0個選択中</div>
  <button class="action-btn" id="clearSelected">クリア</button>
  <button class="action-btn primary" id="playSelected">▶ 再生</button>
</div>

<div id="modal">
  <div class="modal-header">
    <button class="modal-close" id="modalClose">閉じる</button>
    <button class="modal-speak" id="modalSpeak">🔊 もう一度</button>
  </div>
  <div class="modal-body" id="modalBody">
    <div class="modal-pose-num" id="modalPoseNum" style="display:none"></div>
    <div class="ja-text" id="modalJa"></div>
    <div class="ko-text" id="modalKo"></div>
    <div class="modal-hint">画面をタップで閉じます</div>
  </div>
</div>

<div id="addModal">
  <div class="add-modal-inner">
    <h3>単語を追加</h3>
    <div id="keySection" class="key-section" style="display:none">
      <div class="label">⚠️ OpenAI APIキーが未設定です（追加にのみ使用、端末内のみに保存）</div>
      <input type="password" id="keyInput" placeholder="sk-...">
      <button class="primary" id="saveKeyBtn">キーを保存</button>
    </div>
    <label>日本語</label>
    <input type="text" id="addJaInput" placeholder="例: 海 / 砂浜 / きれいですね" autocomplete="off">
    <button class="primary" id="translateBtn">翻訳</button>
    <div id="addStatus" class="status" style="display:none"></div>
    <div id="addPreview" class="preview" style="display:none">
      <div class="pv-ja" id="pvJa"></div>
      <div class="pv-ko" id="pvKo"></div>
    </div>
    <div class="row">
      <button class="secondary" id="addCancelBtn">閉じる</button>
      <button class="primary" id="addSaveBtn" disabled>追加</button>
    </div>
  </div>
</div>

<script>
// Each phrase: { ja, ru (ruby string with "korean|katakana" tokens), h (audio hash), pose? }
const PHRASES = [
  {
    c: "① よく使う",
    items: [
      { ja: "はじめまして。今回の撮影の担当を務めます岡村と申します。", ru: "처음|チョウム 뵙겠습니다.|ペッケッスムニダ 이번|イボン 촬영을|チャリョンウル 담당하는|タムダンハヌン 오카무라라고|オカムララゴ 합니다.|ハムニダ", h: "859155d658" },

// === Utilities ===
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderRuby(ru) {
  return ru.split(/\s+/).filter(Boolean).map(t => {
    const i = t.indexOf('|');
    if (i < 0) return escapeHtml(t);
    const base = t.slice(0, i);
    const reading = t.slice(i + 1);
    return `<ruby>${escapeHtml(base)}<rt>${escapeHtml(reading)}</rt></ruby>`;
  }).join(' ');
}

function extractKo(ru) {
  return ru.split(/\s+/).filter(Boolean).map(t => {
    const i = t.indexOf('|');
    return i < 0 ? t : t.slice(0, i);
  }).join(' ');
}

function stopAllAudio() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.src = '';
    currentAudio = null;
  }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

async function playItem(item, opts = {}) {
  stopAllAudio();
  let audioUrl = null;
  let revokeUrl = null;
  if (item.h) {
    audioUrl = `audio/${item.h}.mp3`;
  } else if (item.id) {
    const blob = await loadAudio(item.id);
    if (blob) {
      audioUrl = URL.createObjectURL(blob);
      revokeUrl = audioUrl;
    }
  }
  const fallbackText = item.ru ? extractKo(item.ru) : (item.ko || '');
  return new Promise((resolve) => {
    if (!audioUrl) {
      speakKoreanFallback(fallbackText, currentSpeed).then(resolve);
      return;
    }
    const audio = new Audio(audioUrl);
    audio.playbackRate = currentSpeed;
    currentAudio = audio;
    let resolved = false;
    const finish = () => {
      if (resolved) return;
      resolved = true;
      if (revokeUrl) URL.revokeObjectURL(revokeUrl);
      if (currentAudio === audio) currentAudio = null;
      resolve();
    };
    audio.onended = finish;
    audio.onerror = () => {
      if (resolved) return;
      speakKoreanFallback(fallbackText, currentSpeed).then(finish);
    };
    audio.play().catch(() => {
      if (resolved) return;
      speakKoreanFallback(fallbackText, currentSpeed).then(finish);
    });
  });
}

function speakKoreanFallback(text, rate) {
  return new Promise((resolve) => {
    if (!('speechSynthesis' in window)) return resolve();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.rate = rate || 1;
    const voices = speechSynthesis.getVoices();
    const koVoice = voices.find(v => v.lang === 'ko-KR') || voices.find(v => v.lang.startsWith('ko'));
    if (koVoice) u.voice = koVoice;
    u.onend = resolve;
    u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

function base64ToBlob(b64, mime = 'audio/mpeg') {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

async function exportWords() {
  const words = JSON.parse(localStorage.getItem('wordBlocks') || '[]');
  const apiKey = localStorage.getItem('openaiKey') || '';
  if (words.length === 0 && !apiKey) {
    alert('バックアップする単語もキーもありません');
    return;
  }
  const audioMap = {};
  for (const w of words) {
    const blob = await loadAudio(w.id);
    if (blob) {
      try { audioMap[w.id] = await blobToBase64(blob); } catch (e) {}
    }
  }
  const data = {
    version: 2,
    exported: new Date().toISOString(),
    words,
    audio: audioMap,
    openaiKey: apiKey,
  };
  const json = JSON.stringify(data);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const date = new Date().toISOString().slice(0, 10).replace(/-/g, '');
  const filename = `star-tour-words-${date}.json`;
  if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], filename, { type: 'application/json' })] })) {
    try {
      await navigator.share({
        files: [new File([blob], filename, { type: 'application/json' })],
        title: 'star-tour 単語バックアップ',
      });
      URL.revokeObjectURL(url);
      return;
    } catch (e) {}
  }
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function importWords(file) {
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data || !Array.isArray(data.words)) throw new Error('無効なファイル形式');
    const existing = JSON.parse(localStorage.getItem('wordBlocks') || '[]');
    const existingIds = new Set(existing.map(w => w.id));
    const newWords = data.words.filter(w => !existingIds.has(w.id));
    const merged = [...existing, ...newWords];
    localStorage.setItem('wordBlocks', JSON.stringify(merged));
    wordBlocks = merged;
    let audioCount = 0;
    if (data.audio) {
      for (const [id, b64] of Object.entries(data.audio)) {
        try {
          const blob = base64ToBlob(b64);
          await saveAudio(id, blob);
          audioCount++;
        } catch (e) {}
      }
    }
    let keyRestored = false;
    if (data.openaiKey && data.openaiKey.startsWith('sk-')) {
      if (!localStorage.getItem('openaiKey')) {
        localStorage.setItem('openaiKey', data.openaiKey);
        keyRestored = true;
      }
    }
    if (currentCategory === WORDS_TAB) renderWordsGrid();
    const parts = [`${newWords.length}個の単語を復元しました`];
    if (audioCount > 0) parts.push(`音声${audioCount}個`);
    if (keyRestored) parts.push('APIキーも復元');
    alert(parts.join(' / '));
  } catch (e) {
    alert(`復元失敗: ${e.message || e}`);
  }
}

function attachDragHandlers(card, grid) {
  let timer = null;
  let dragging = false;
  let clone = null;
  let startX = 0, startY = 0;
  let offsetX = 0, offsetY = 0;

  function cleanup() {
    if (timer) { clearTimeout(timer); timer = null; }
    if (dragging) {
      dragging = false;
      card.classList.remove('drag-source');
      card.style.pointerEvents = '';
      if (clone) { clone.remove(); clone = null; }
      const newOrder = [];
      grid.querySelectorAll('.word-card').forEach(c => {
        const item = wordBlocks.find(w => w.id === c.dataset.id);
        if (item) newOrder.push(item);
      });
      wordBlocks = newOrder;
      saveWordBlocks();
      card.dataset.dragJustEnded = '1';
      setTimeout(() => { delete card.dataset.dragJustEnded; }, 300);
    }
  }

  function activate() {
    timer = null;
    dragging = true;
    if (navigator.vibrate) navigator.vibrate(40);
    const rect = card.getBoundingClientRect();
    clone = card.cloneNode(true);
    clone.classList.add('drag-clone');
    clone.classList.remove('drag-source');
    clone.style.left = rect.left + 'px';
    clone.style.top = rect.top + 'px';
    clone.style.width = rect.width + 'px';
    clone.style.height = rect.height + 'px';
    document.body.appendChild(clone);
    card.classList.add('drag-source');
    card.style.pointerEvents = 'none';
  }

  card.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    const rect = card.getBoundingClientRect();
    offsetX = startX - rect.left;
    offsetY = startY - rect.top;
    timer = setTimeout(activate, 400);
  }, { passive: true });

  card.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (timer && !dragging) {
      if (Math.abs(t.clientX - startX) > 8 || Math.abs(t.clientY - startY) > 8) {
        clearTimeout(timer); timer = null;
      }
      return;
    }
    if (!dragging) return;
    e.preventDefault();
    if (clone) {
      clone.style.left = (t.clientX - offsetX) + 'px';
      clone.style.top = (t.clientY - offsetY) + 'px';
    }
    const elem = document.elementFromPoint(t.clientX, t.clientY);
    const targetCard = elem && elem.closest && elem.closest('.word-card');
    if (!targetCard || targetCard === card || !grid.contains(targetCard)) return;
    const rect = targetCard.getBoundingClientRect();
    const before = (t.clientX - rect.left) < rect.width / 2;
    if (before) grid.insertBefore(card, targetCard);
    else grid.insertBefore(card, targetCard.nextSibling);
  }, { passive: false });

  card.addEventListener('touchend', cleanup);
  card.addEventListener('touchcancel', cleanup);
}

// === IndexedDB for word audio storage ===
let audioDBPromise = null;
function openAudioDB() {
  if (audioDBPromise) return audioDBPromise;
  audioDBPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open('star-tour-audio', 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('audio')) {
        db.createObjectStore('audio', { keyPath: 'id' });
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
  return audioDBPromise;
}
async function saveAudio(id, blob) {
  const db = await openAudioDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('audio', 'readwrite');
    tx.objectStore('audio').put({ id, blob });
    tx.oncomplete = resolve;
    tx.onerror = (e) => reject(e.target.error);
  });
}
async function loadAudio(id) {
  try {
    const db = await openAudioDB();
    return new Promise((resolve) => {
      const tx = db.transaction('audio', 'readonly');
      const req = tx.objectStore('audio').get(id);
      req.onsuccess = (e) => resolve(e.target.result?.blob || null);
      req.onerror = () => resolve(null);
    });
  } catch { return null; }
}
async function deleteAudio(id) {
  try {
    const db = await openAudioDB();
    return new Promise((resolve) => {
      const tx = db.transaction('audio', 'readwrite');
      tx.objectStore('audio').delete(id);
      tx.oncomplete = resolve;
      tx.onerror = resolve;
    });
  } catch {}
}

async function generateTTS(text, apiKey) {
  const res = await fetch('https://api.openai.com/v1/audio/speech', {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${apiKey}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      model: 'gpt-4o-mini-tts',
      voice: 'shimmer',
      input: text,
      instructions: 'Speak in a bright, clear, youthful Korean female tour guide voice. Pronounce naturally and gently. Slightly higher pitch, friendly and welcoming.',
      response_format: 'mp3',
    }),
  });
  if (!res.ok) {
    const t = await res.text();
    throw new Error(`HTTP ${res.status}: ${t.slice(0, 80)}`);
  }
  return await res.blob();
}

let currentWordAudio = null;
async function speakWord(w, cardEl) {
  document.querySelectorAll('.word-card.playing').forEach(c => c.classList.remove('playing'));
  if (cardEl) cardEl.classList.add('playing');
  if (currentWordAudio) { try { currentWordAudio.pause(); } catch {} currentWordAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const blob = await loadAudio(w.id);
  if (blob) {
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.playbackRate = currentSpeed;
    currentWordAudio = audio;
    const cleanup = () => {
      if (cardEl) cardEl.classList.remove('playing');
      URL.revokeObjectURL(url);
      if (currentWordAudio === audio) currentWordAudio = null;
    };
    audio.onended = cleanup;
    audio.onerror = cleanup;
    audio.play().catch(cleanup);
    return;
  }
  // Fallback to browser TTS
  if (!('speechSynthesis' in window)) {
    if (cardEl) cardEl.classList.remove('playing');
    return;
  }
  const u = new SpeechSynthesisUtterance(w.ko);
  u.lang = 'ko-KR';
  u.rate = currentSpeed;
  const voices = speechSynthesis.getVoices();
  const ko = voices.find(v => v.lang === 'ko-KR') || voices.find(v => v.lang.startsWith('ko'));
  if (ko) u.voice = ko;
  u.onend = () => { if (cardEl) cardEl.classList.remove('playing'); };
  u.onerror = () => { if (cardEl) cardEl.classList.remove('playing'); };
  speechSynthesis.speak(u);
}

async function translateJaToKo(ja, apiKey) {
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${apiKey}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      model: 'gpt-4o-mini',
      messages: [
        { role: 'system', content: `You translate Japanese to natural Korean for a tour guide context.

Output strict JSON: {"ko": "<Korean>", "kana": "<Japanese katakana pronunciation>"}

Rules:
1. For a single noun input, output ONLY the Korean noun without any verb endings. Example: 海 -> {"ko":"바다","kana":"パダ"}
2. For a sentence/phrase input, use polite formal Korean (합쇼체 with -습니다 / 해주세요).
3. The kana field MUST be Japanese katakana characters (アイウエオ etc), NOT Korean Hangul. Japanese phonetic approximation of the Korean pronunciation, with each Korean word separated by a space.
4. Use ッ for Korean tense consonants. Use ㅓ -> オ, ㅡ -> ウ.

Examples:
안녕하세요 -> アンニョンハセヨ
손가락 -> ソンカラク
잠시만 기다려 주세요 -> チャムシマン キダリョ ジュセヨ
바다 -> パダ` },
        { role: 'user', content: ja },
      ],
      response_format: { type: 'json_object' },
      temperature: 0.3,
    }),
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`HTTP ${res.status}: ${txt.slice(0, 80)}`);
  }
  const data = await res.json();
  const content = data.choices?.[0]?.message?.content;
  if (!content) throw new Error('空のレスポンス');
  const parsed = JSON.parse(content);
  if (!parsed.ko) throw new Error('koが含まれていません');
  return { ko: parsed.ko, kana: parsed.kana || '' };
}

      <button class="big-btn" id="shareTranslateBtn">📤 翻訳する（iOS翻訳を呼び出し）</button>
      <button class="secondary-btn" id="copyTranslateBtn">📋 コピーのみ</button>
      <div class="help-box">
        <strong>使い方:</strong>
        <span class="step">① 上の欄に日本語を入力</span>
        <span class="step">② 「📤 翻訳する」をタップ</span>

        <br>
        <strong>💡 ヒント:</strong>
        <span class="step">テキストを長押しして直接「翻訳」を選ぶこともできます</span>

      try { await navigator.share({ text }); } catch (e) {}

      try { await navigator.clipboard.writeText(text); } catch (e) {}
      alert('共有機能が使えないためクリップボードにコピーしました。「翻訳」アプリを開いて貼り付けてください。');

      const orig = btn.textContent;
      btn.textContent = '✓ コピーしました';
      setTimeout(() => { btn.textContent = orig; }, 1200);
    } catch (e) {}
  };
}

// === Web Audio API: silence-trimmed continuous playback ===
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctor();
  }
  return audioCtx;
}

async function loadAudioBuffer(item, ctx) {
  let arrayBuffer = null;
  if (item.h) {
    try {
      const res = await fetch(`audio/${item.h}.mp3`);
      if (!res.ok) return null;
      arrayBuffer = await res.arrayBuffer();
    } catch { return null; }
  } else if (item.id) {
    const blob = await loadAudio(item.id);
    if (!blob) return null;
    arrayBuffer = await blob.arrayBuffer();
  } else {
    return null;
  }
  try {
    return await ctx.decodeAudioData(arrayBuffer);
  } catch { return null; }
}

function trimSilence(buffer, ctx, threshold = 0.012) {
  const data = buffer.getChannelData(0);
  const len = data.length;
  let start = 0, end = len - 1;
  while (start < len && Math.abs(data[start]) < threshold) start++;
  while (end > 0 && Math.abs(data[end]) < threshold) end--;
  if (start >= end) return buffer;
  const padStart = Math.max(0, start - Math.floor(buffer.sampleRate * 0.005));
  const padEnd = Math.min(len, end + Math.floor(buffer.sampleRate * 0.01));
  const newLen = padEnd - padStart;
  const out = ctx.createBuffer(buffer.numberOfChannels, newLen, buffer.sampleRate);
  for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
    const src = buffer.getChannelData(ch);
    out.getChannelData(ch).set(src.subarray(padStart, padEnd));
  }
  return out;
}

function gapAfterItem(item, isLast) {
  if (isLast) return 0;
  const text = item.h ? extractKo(item.ru) : (item.ko || '');
  // Sentence boundary -> natural breath
  if (/[.!?。！？]\s*$/.test(text)) return 0.18;
  // Comma -> brief pause
  if (/[,、]\s*$/.test(text)) return 0.10;
  // Word -> almost continuous
  return 0.04;
}

let scheduledSources = [];
let highlightTimers = [];

function clearScheduled() {
  scheduledSources.forEach(s => { try { s.stop(); } catch {} });
  scheduledSources = [];
  highlightTimers.forEach(id => clearTimeout(id));
  highlightTimers = [];
}

async function playSelectedSmooth() {
  if (selected.length === 0) return;
  const ctx = getAudioCtx();
  if (ctx.state === 'suspended') {
    try { await ctx.resume(); } catch {}
  }
  const items = [...selected];
  // Pre-load + trim all buffers in parallel
  const loaded = await Promise.all(items.map(async item => ({
    item,
    buffer: await loadAudioBuffer(item, ctx).then(buf => buf && trimSilence(buf, ctx)).catch(() => null),
  })));
  if (stopBatchRequested) return;
  // Schedule
  clearScheduled();
  const baseTime = ctx.currentTime + 0.06;
  let cursor = baseTime;
  loaded.forEach(({ item, buffer }, idx) => {
    if (!buffer) return;
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.playbackRate.value = currentSpeed;
    src.connect(ctx.destination);
    src.start(cursor);
    scheduledSources.push(src);
    const dur = buffer.duration / currentSpeed;
    const offsetMs = Math.max(0, (cursor - ctx.currentTime) * 1000);
    const endMs = offsetMs + dur * 1000;
    const k = item.h || item.id;
    highlightTimers.push(setTimeout(() => {
      if (stopBatchRequested) return;
      const btn = document.querySelector(`.phrase-btn[data-h="${k}"], .word-card[data-id="${k}"]`);
      if (btn) {
        document.querySelectorAll('.phrase-btn.playing, .word-card.playing').forEach(b => b.classList.remove('playing'));
        btn.classList.add('playing');
        btn.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }, offsetMs));
    highlightTimers.push(setTimeout(() => {
      const btn = document.querySelector(`.phrase-btn[data-h="${k}"].playing, .word-card[data-id="${k}"].playing`);
      if (btn) btn.classList.remove('playing');
    }, endMs));
    const isLast = idx === loaded.length - 1;
    cursor += dur + gapAfterItem(item, isLast);
  });
  // Wait for end
  const totalMs = Math.max(0, (cursor - ctx.currentTime) * 1000) + 100;
  await new Promise(r => setTimeout(r, totalMs));
  document.querySelectorAll('.phrase-btn.playing, .word-card.playing').forEach(b => b.classList.remove('playing'));
}

function bindPlaySelected() {
  playSelectedBtn.onclick = async () => {
    if (selected.length === 0 || isPlayingBatch) return;
    isPlayingBatch = true;
    stopBatchRequested = false;
    playSelectedBtn.textContent = '⏸ 停止';
    const stopHandler = () => {
      stopBatchRequested = true;
      clearScheduled();
      stopAllAudio();
    };
    playSelectedBtn.onclick = stopHandler;
    try {
      await playSelectedSmooth();
    } finally {
      clearScheduled();
      document.querySelectorAll('.phrase-btn.playing, .word-card.playing').forEach(b => b.classList.remove('playing'));
      isPlayingBatch = false;
      stopBatchRequested = false;
      playSelectedBtn.textContent = '▶ 再生';
      bindPlaySelected();
    }
  };
}
